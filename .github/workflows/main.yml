name: Build and Test Django

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Clone the code
      uses: actions/checkout@v4
      run: echo "code clonned sucessfully.."
  
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.12'

    - name: Install MySQL Client System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmysqlclient-dev pkg-config

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mysqlclient  # Ensures the module is explicitly installed
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Database Migrations
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_NAME: test_db
        DB_USER: root
        DB_PASSWORD: rootpassword
      run: |
        python manage.py migrate

    - name: Run Tests
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_NAME: test_db
        DB_USER: root
        DB_PASSWORD: rootpassword
      run: |
        python manage.py test
